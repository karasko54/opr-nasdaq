name: Suivi trade OPR -> Telegram

# Surveille le trade du jour (BE / TP / SL) toutes les 10 min pendant la seance.
# 13:00-20:59 UTC couvre 15h45-21h Paris (ete comme hiver).
on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opr-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Surveiller le trade (NASDAQ)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPR_SYMBOL: "^NDX"
          OPR_ASSET: "nas"
          OPR_LABEL: "NAS100"
        run: python trade_monitor.py

      - name: Surveiller le trade (BTC)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPR_SYMBOL: "BTC-USD"
          OPR_ASSET: "btc"
          OPR_LABEL: "BTC"
          OPR_TRADE: "trade_today_btc.json"
        run: python trade_monitor.py

      - name: Memoriser l'avancement du trade
        if: always()
        run: |
          git config user.name  "opr-bot"
          git config user.email "opr-bot@users.noreply.github.com"
          git add trade_today.json .opr_state journal.csv trade_today_btc.json .opr_state_btc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a committer"; exit 0
          fi
          git commit -m "etat: avancement trade + journal (NASDAQ + BTC)"
          # push robuste : re-synchronise et reessaie pour ne jamais perdre le journal
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin master && git push; then
              echo "push OK (tentative $i)"; exit 0
            fi
            echo "push echoue, nouvelle tentative dans $((i*3))s..."; sleep $((i*3))
          done
          echo "!! push definitivement echoue apres 5 tentatives"; exit 1

      - name: Alerte Telegram si echec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          MSG="⚠️ ${GITHUB_WORKFLOW} a échoué (run #${GITHUB_RUN_NUMBER}). Détails : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for c in "${CHATS[@]}"; do
            [ -n "$c" ] && curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${c}" --data-urlencode "text=${MSG}" >/dev/null || true
          done

name: Recap mensuel -> Telegram

# Bilan du mois envoye le DERNIER DIMANCHE, une seule fois (fichier d'etat).
# Plusieurs reveils le dimanche : les crons GitHub partent souvent avec
# plusieurs heures de retard, et un depart repousse apres minuit ferait
# sauter le recap du mois. Le script rattrape aussi le lundi si besoin.
on:
  schedule:
    - cron: "20 8 * * 0"
    - cron: "20 12 * * 0"
    - cron: "20 16 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer le recap maintenant (hors dernier dimanche)"
        type: boolean
        default: false

permissions:
  contents: write           # pour memoriser le recap deja envoye

concurrency:
  group: opr-state          # meme verrou que opr.yml / monitor.yml
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Envoyer le recap mensuel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECAP_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: python recap.py

      - name: Memoriser le recap envoye
        if: always()
        run: |
          git config user.name  "opr-bot"
          git config user.email "opr-bot@users.noreply.github.com"
          git add .recap_state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a committer"; exit 0
          fi
          git commit -m "etat: recap mensuel envoye"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin master && git push; then
              echo "push OK (tentative $i)"; exit 0
            fi
            echo "push echoue, nouvelle tentative dans $((i*3))s..."; sleep $((i*3))
          done
          echo "!! push definitivement echoue apres 5 tentatives"; exit 1

      - name: Alerte Telegram si echec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          MSG="⚠️ ${GITHUB_WORKFLOW} a échoué (run #${GITHUB_RUN_NUMBER}). Détails : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for c in "${CHATS[@]}"; do
            [ -n "$c" ] && curl -s -X POST --retry 4 --retry-delay 3 --retry-all-errors \
              --max-time 30 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${c}" --data-urlencode "text=${MSG}" >/dev/null || true
          done

name: Garde-fou silence -> Telegram

# Alerte si aucune session OPR n'a ete envoyee un jour ouvre.
#
# POURQUOI : le robot repose en pratique sur UN seul declenchement fiable,
# cron-job.org a 13:48 UTC. Mesure sur 350 executions (20/07 -> 25/09/2026) :
# les crons GitHub arrivent a 18:04 UTC en mediane, et 84 % tombent APRES la
# fermeture de la fenetre d'entree. Ils ne servent donc PAS de filet.
# Si cron-job.org tombe, le silence est total et rien ne previent.
#
# Ce garde-fou n'a pas besoin d'etre a l'heure : une alerte en retard reste
# une alerte. Il peut donc s'appuyer sur le planificateur GitHub, ce qui le
# rend INDEPENDANT du declencheur qu'il surveille — c'est tout l'interet.
on:
  schedule:
    - cron: "40 15 * * 1-5"   # 11:40 New York en ete, juste apres la fenetre
    - cron: "40 20 * * 1-5"   # rattrapage tardif, au cas ou le premier glisse
  workflow_dispatch:

permissions:
  contents: read              # lecture seule : ce workflow ne modifie rien

jobs:
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependances
        run: pip install requests

      - name: Verifier qu'une session a bien ete envoyee
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python garde_silence.py

name: OPR Nasdaq -> Telegram

# Se reveille apres l'ouverture US (09:45 New York).
#
# ATTENTION — LE FILET N'EN EST PAS UN. Les crons GitHub ci-dessous etaient
# censes "rattraper un eventuel petit retard". Mesure sur 350 executions
# (20/07 -> 25/09/2026) : le retard n'a rien de petit.
#     horaire programme : 13:45 -> 16:15 UTC
#     horaire reel      : mediane 18:04 UTC
#     84 % arrivent APRES 15:30 UTC, soit apres la fermeture de la fenetre
#     d'entree (11:30 New York) : opr_live.py les rejette, a juste titre.
# En pratique, le SEUL declenchement fiable est celui de cron-job.org a
# 13:48 UTC. Les crons sont conserves parce qu'ils ne coutent rien et tombent
# juste 16 % du temps, mais ils ne doivent PAS etre pris pour un filet.
# Le vrai filet, c'est garde.yml : il alerte sur Telegram si aucune session
# n'a ete envoyee un jour ouvre. Le script a un garde-fou
# (n'agit qu'entre 09:45 et 11:30 New York) + un anti-doublon (1 seul message).
#   ETE  (EDT) : 09:45 NY = 13:45 UTC ... 11:30 NY = 15:30 UTC
#   HIVER(EST) : 09:45 NY = 14:45 UTC ... 11:30 NY = 16:30 UTC
# HEURE D'HIVER : opr_live.py attend l'ouverture s'il est declenche trop tot
# (ex: trigger externe fixe a 13:48 UTC = 08:48 NY en hiver) -> un seul horaire
# de declenchement fonctionne toute l'annee, aucun reglage saisonnier requis.
on:
  schedule:
    - cron: "45 13 * * 1-5"
    - cron: "5 14 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "45 15 * * 1-5"
    - cron: "15 16 * * 1-5"
  workflow_dispatch:        # declencheur externe (cron-job.org) OU bouton manuel
    inputs:
      test:
        description: "Envoyer un message de TEST (donnees fictives)"
        type: boolean
        default: false          # declenchement externe = VRAI run ; cocher pour tester

permissions:
  contents: write           # pour memoriser la session deja envoyee (anti-doublon)

jobs:
  opr:
    runs-on: ubuntu-latest
    concurrency:
      group: opr-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le robot OPR (NASDAQ)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPR_SYMBOL: "^NDX"
          OPR_ASSET: "nas"
          OPR_LABEL: "NAS100"
          OPR_BUFFER: "0.40"
          # en run manuel avec la case cochee -> message de test ; sinon vide
          OPR_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '' }}
        run: python opr_live.py

      - name: Lancer le robot OPR (BTC)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPR_SYMBOL: "BTC-USD"
          OPR_ASSET: "btc"
          OPR_LABEL: "BTC"
          OPR_BUFFER: "0.50"
          OPR_STATE: ".opr_state_btc"
          OPR_TRADE: "trade_today_btc.json"
          OPR_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '' }}
        run: python opr_live.py

      - name: Memoriser la session envoyee
        if: always()
        run: |
          git config user.name  "opr-bot"
          git config user.email "opr-bot@users.noreply.github.com"
          git add .opr_state trade_today.json .opr_state_btc trade_today_btc.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a committer"; exit 0
          fi
          git commit -m "etat: session envoyee (NASDAQ + BTC)"
          # push robuste : re-synchronise et reessaie au lieu d'avaler l'echec en silence
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin master && git push; then
              echo "push OK (tentative $i)"; exit 0
            fi
            echo "push echoue, nouvelle tentative dans $((i*3))s..."; sleep $((i*3))
          done
          echo "!! push definitivement echoue apres 5 tentatives"; exit 1

      - name: Alerte Telegram si echec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          MSG="⚠️ ${GITHUB_WORKFLOW} a échoué (run #${GITHUB_RUN_NUMBER}). Détails : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for c in "${CHATS[@]}"; do
            [ -n "$c" ] && curl -s -X POST --retry 4 --retry-delay 3 --retry-all-errors \
              --max-time 30 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${c}" --data-urlencode "text=${MSG}" >/dev/null || true
          done

name: Demo messages -> Telegram (prive)

# Envoie les messages d'une journee type, marques TEST, au destinataire PRIVE seulement
# (jamais au canal). Aucun vrai signal, aucun etat modifie.
# Declenchement : bouton manuel, ou modification du fichier .demo_declencheur.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".demo_declencheur"]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Envoyer la journee de demonstration
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python demo_messages.py

name: Collecte niveaux options QQQ

# Photo quotidienne de la chaine d'options QQQ -> options_levels.csv + chaine
# brute dans data/options/. Sert a construire l'historique necessaire au
# backtest order flow + options (backtest_flow_options.py), que yfinance ne
# fournit pas.
# 11:23 UTC = 07:23 NY en ete / 06:23 NY en hiver : apres la publication de
# l'OI par l'OCC, avant l'ouverture. Les crons GitHub arrivent souvent avec
# plusieurs heures de retard : le script tolere jusqu'a 16:00 NY.
on:
  schedule:
    - cron: "23 11 * * 1-5"
    - cron: "41 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Deja collecte aujourd'hui ?
        id: done
        run: |
          D=$(TZ=America/New_York date +%F)
          if [ -f "data/options/${D}_QQQ.csv.gz" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Collecter la chaine QQQ
        if: steps.done.outputs.skip != '1'
        run: python collect_options_levels.py

      - name: Sauvegarder
        if: steps.done.outputs.skip != '1'
        run: |
          git config user.name  "opr-bot"
          git config user.email "opr-bot@users.noreply.github.com"
          git add options_levels.csv data/options/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a committer"; exit 0
          fi
          git commit -m "donnees: niveaux options QQQ"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "push OK (tentative $i)"; exit 0
            fi
            echo "push echoue, nouvelle tentative dans $((i*3))s..."; sleep $((i*3))
          done
          exit 1

      - name: Alerte Telegram si echec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          MSG="⚠️ ${GITHUB_WORKFLOW} a échoué (run #${GITHUB_RUN_NUMBER}). Détails : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for c in "${CHATS[@]}"; do
            [ -n "$c" ] && curl -s -X POST --retry 4 --retry-delay 3 --retry-all-errors \
              --max-time 30 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${c}" --data-urlencode "text=${MSG}" >/dev/null || true
          done
